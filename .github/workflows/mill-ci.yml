name: 0xRay CI/CD

# Mill self-host. File is mill-ci.yml so GitHub registers a fresh workflow
# (ci.yml was stuck queued after inactivity disable).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, bifrost/main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mill-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.22.1"

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint

  mill:
    name: Foundry mill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Docs mill
        run: npm run release:docs-check
      - name: Mill tests
        # Includes inspect shop-plant allowlist (factory shops + shopPlant, not costume:true)
        # plus llms.txt / mill-law docs + pack-tmp-suit-proof contract.
        # plus two-seat Grok wear (project dest, no last-wins machine plugin clobber).
        run: npx vitest run src/__tests__/unit/foundry-mill.test.ts src/__tests__/unit/foundry-mill-plant-protocol.test.ts src/__tests__/unit/foundry-sound-plant.test.ts src/__tests__/unit/wear-shipped-skill-blobs.test.ts src/__tests__/unit/foundry-sound-mixer.test.ts src/__tests__/unit/foundry-sound-inventory.test.ts src/__tests__/unit/foundry-blip-plant.test.ts src/__tests__/unit/foundry-blip-vibe.test.ts src/__tests__/unit/foundry-blip-looker.test.ts src/__tests__/unit/release-pipeline.test.ts src/__tests__/unit/grok-multi-seat-wear.test.ts src/__tests__/unit/host-vs-mill-score.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Plugin infrastructure
        run: node scripts/test/validate-plugins-e2e.cjs --structural-only

  test:
    name: Comprehensive tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: grok-bot pack
        run: node scripts/check-grok-bot-pack.mjs
      - name: Curated unit suites
        run: npm run test:comprehensive
      - name: Confer verify
        run: npm run verify:confer

  smoke:
    name: Consumer smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Consumer install smoke
        # Pack tgz → tmp install → mill fasten + hangar shop plant + inspect (not costume).
        # Playwright n/a (mill CLI). Standalone: npm run pack:tmp-proof
        run: node scripts/node/consumer-install-smoke.mjs

  data-check:
    name: Data check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Block checked-in run data
        run: node .ci/check-data.mjs
      - name: Reject a suited rerun log
        run: node .ci/check-data.mjs --self-check

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Mill Docusaurus build
        run: node scripts/foundry/docs-build.mjs

  house-live:
    name: house/live tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Cache Playwright browsers
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright chromium
        # Same package install as Quality Checks (npm ci --ignore-scripts). That does not download a browser.
        # The browser cache is the warm path. A cold download still fits in the 30 minute job.
        run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - name: house/live tests
        env:
          SPECTRUM_OUT: ${{ runner.temp }}/spectrum
        run: bash house/live/tests/run_tests.sh
      - name: house/live-mesh tests
        run: cd house/live-mesh && python3 -m unittest -q test_fetch_feed test_tripwire_push

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality, mill, build, test, smoke, docs-build, house-live]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          echo "Quality: ${{ needs.quality.result }}"
          echo "Mill: ${{ needs.mill.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Smoke: ${{ needs.smoke.result }}"
          echo "Docs: ${{ needs.docs-build.result }}"
          echo "house/live: ${{ needs.house-live.result }}"
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.mill.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.smoke.result }}" != "success" ] || \
             [ "${{ needs.docs-build.result }}" != "success" ] || \
             [ "${{ needs.house-live.result }}" != "success" ]; then
            echo "One or more required mill CI jobs failed"
            exit 1
          fi
          echo "Required mill CI jobs passed"
