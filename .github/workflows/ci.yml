name: 0xRay CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint

  mill:
    name: Foundry mill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Docs mill
        run: npm run release:docs-check
      - name: Mill tests
        run: npx vitest run src/__tests__/unit/foundry-mill.test.ts src/__tests__/unit/release-pipeline.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Plugin infrastructure
        run: node scripts/test/validate-plugins-e2e.cjs --structural-only

  test:
    name: Comprehensive tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Curated unit suites
        run: npm run test:comprehensive

  smoke:
    name: Consumer smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Consumer install smoke
        run: node scripts/node/consumer-install-smoke.mjs

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'docs') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: cd docs-site && npm ci
      - run: cd docs-site && npm run build

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality, mill, build, test, smoke]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          echo "Quality: ${{ needs.quality.result }}"
          echo "Mill: ${{ needs.mill.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Smoke: ${{ needs.smoke.result }}"
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.mill.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.smoke.result }}" != "success" ]; then
            echo "One or more required mill CI jobs failed"
            exit 1
          fi
          echo "Required mill CI jobs passed"
