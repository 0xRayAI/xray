# Foundry mill: era headers + CHANGELOG vs package.json. Not UVM.
name: Foundry mill (version + docs)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  foundry-mill:
    name: Validate mill contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release docs mill
        run: npm run release:docs-check

      - name: Foundry mill tests
        run: npx vitest run src/__tests__/unit/foundry-mill.test.ts src/__tests__/unit/release-pipeline.test.ts
