<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>0xRay</title>
  <meta name="description" content="0xRay is a three-subsystem autonomous engine. The suit is the wear. Install with npm i -g 0xray." />
  <link rel="icon" href="assets/favicon.png" />
  <style>
    @font-face {
      font-family: "Black Ops One";
      src: url("assets/fonts/BlackOpsOne-Regular.ttf") format("truetype");
      font-display: block;
    }
    @font-face {
      font-family: "Chakra Petch";
      src: url("assets/fonts/ChakraPetch-Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: block;
    }
    @font-face {
      font-family: "Barlow Condensed";
      src: url("assets/fonts/BarlowCondensed-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-display: block;
    }
    :root {
      --void: #08090b;
      --cyan: #5ad6de;
      --glow: #78e1ff;
      --ink: #ecece8;
      --orange: #dc5812;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
      background:
        radial-gradient(ellipse at 50% -10%, #2c2e31 0%, transparent 55%),
        repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 3px),
        linear-gradient(180deg, #1a1c1e, #0c0d0f 40%, #08090b);
    }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 28px 72px;
    }
    .tray {
      padding: 18px;
      border-radius: 22px;
      background: linear-gradient(180deg, #2a2c2e, #141516);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.08),
        inset 0 -8px 16px rgba(0,0,0,0.45),
        0 0 0 1px #3a3c3e;
    }
    .plate {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }
    .install {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 28px 16px;
      border-radius: 12px;
      background:
        radial-gradient(circle at 14px 14px, #111 3px, #9aa0a4 3.5px, #3a3e42 7px, transparent 8px),
        radial-gradient(circle at calc(100% - 14px) 14px, #111 3px, #9aa0a4 3.5px, #3a3e42 7px, transparent 8px),
        radial-gradient(circle at 14px calc(100% - 14px), #111 3px, #9aa0a4 3.5px, #3a3e42 7px, transparent 8px),
        radial-gradient(circle at calc(100% - 14px) calc(100% - 14px), #111 3px, #9aa0a4 3.5px, #3a3e42 7px, transparent 8px),
        linear-gradient(165deg, #6c7074 0%, #3c4044 42%, #2a2d30 100%);
      box-shadow:
        0 10px 18px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.45),
        inset 0 -3px 0 rgba(0,0,0,0.35);
    }
    .install span {
      font-family: "Chakra Petch", sans-serif;
      font-size: 18px;
      letter-spacing: 0.22em;
      color: var(--cyan);
    }
    .install code {
      font-family: "Chakra Petch", sans-serif;
      font-size: 32px;
      letter-spacing: 0.04em;
      color: var(--ink);
      text-shadow: 0 1px 0 #08090b;
    }
    .links {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
    }
    .links a {
      display: block;
      padding: 18px 8px 16px;
      text-align: center;
      text-decoration: none;
      font-family: "Chakra Petch", sans-serif;
      font-size: 20px;
      letter-spacing: 0.18em;
      color: var(--glow);
      text-shadow: 0 1px 0 #08090b;
      border-radius: 10px;
      background:
        radial-gradient(circle at 12px 12px, #111 2.5px, #8e9498 3px, #333 6px, transparent 7px),
        radial-gradient(circle at calc(100% - 12px) 12px, #111 2.5px, #8e9498 3px, #333 6px, transparent 7px),
        linear-gradient(180deg, #5c6064, #34383c 55%, #2a2d31);
      box-shadow:
        0 8px 0 #121314,
        0 14px 18px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.35);
    }
    .links a:hover { color: #fff; }
    .links a:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
    @media (max-width: 800px) {
      .install { flex-direction: column; align-items: flex-start; }
      .install code { font-size: 24px; }
      .links { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="tray">
      <img class="plate" src="assets/apex.png" width="1280" height="720" alt="Stamped metal plate. Drawn 0xRay mark. Suit: Inference remembers the laws and the job. Governance judges before the work ships. Engine runs the work. Wake: the next session picks up the job." />
    </div>
    <div class="install">
      <span>INSTALL</span>
      <code>npm i -g 0xray</code>
    </div>
    <ul class="links">
      <li><a href="https://docs.0xray.dev">DOCS</a></li>
      <li><a href="https://github.com/0xRayAI/xray">GITHUB</a></li>
      <li><a href="https://www.npmjs.com/package/0xray">NPM</a></li>
      <li><a href="https://bifrost.0xray.dev">BIFROST</a></li>
    </ul>
  </main>
</body>
</html>
