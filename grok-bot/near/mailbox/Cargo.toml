[package]
name = "foundry-mailbox"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Per-foundry NEAR testnet job mailbox. USDC stays in the Clearing escrow."

[dependencies]
near-sdk = "=5.7.0"
serde_json = "1"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
