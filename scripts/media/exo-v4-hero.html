<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>0xRay v4 exo launch</title>
  <style>
    @font-face {
      font-family: "DIN Condensed";
      src: url("file:///System/Library/Fonts/Supplemental/DIN%20Condensed%20Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    html, body {
      margin: 0;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: #04060c;
    }
    .stage {
      position: relative;
      width: 1280px;
      height: 720px;
    }
    .plate {
      position: absolute;
      inset: 0;
      width: 1280px;
      height: 720px;
      object-fit: fill;
    }
    .mark {
      position: absolute;
      left: 0;
      right: 0;
      top: 86px;
      text-align: center;
      font-family: "DIN Condensed", "Arial Narrow", Arial, sans-serif;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: 0.14em;
      color: #f4f7fb;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
    }
    .visor-chip {
      position: absolute;
      left: 50%;
      top: 168px;
      transform: translateX(-50%);
      min-width: 318px;
      padding: 7px 22px 6px;
      background: rgba(4, 10, 18, 0.82);
      border: 1px solid rgba(143, 212, 238, 0.35);
      border-radius: 2px;
      box-shadow: 0 0 18px rgba(90, 190, 255, 0.22);
      text-align: center;
      font-family: "DIN Condensed", "Arial Narrow", Arial, sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.46em;
      color: #e7f6ff;
      text-transform: uppercase;
    }
    .copy {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      font-family: "DIN Condensed", "Arial Narrow", Arial, sans-serif;
      font-weight: 700;
      white-space: nowrap;
    }
    .line1 {
      bottom: 54px;
      font-size: 22px;
      letter-spacing: 0.34em;
      color: #8fd4ee;
    }
    .line2 {
      bottom: 30px;
      font-size: 15px;
      letter-spacing: 0.38em;
      color: #f4f7fb;
      text-transform: uppercase;
    }
    .line3 {
      bottom: 10px;
      font-size: 12px;
      letter-spacing: 0.44em;
      color: #8b93a2;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="plate" alt="" src="PLATE_SRC" />
    <div class="mark">0xRay</div>
    <div class="visor-chip">CONSTITUTION ON</div>
    <div class="copy line1">0xRAY 4.0.0 — LIVE</div>
    <div class="copy line2">TEMPERAMENT · MULTIPLICITY · SYNCHRONICITY</div>
    <div class="copy line3">GROK BUILD · OPENCODE · HERMES · OPENCLAW</div>
  </div>
</body>
</html>
