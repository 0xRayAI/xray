<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>0xRay 4.0.42 exo</title>
  <style>
    @font-face {
      font-family: "DIN Condensed";
      src: url("file:///System/Library/Fonts/Supplemental/DIN%20Condensed%20Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    html, body {
      margin: 0;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: #000;
    }
    .stage {
      position: relative;
      width: 1280px;
      height: 720px;
    }
    .plate {
      position: absolute;
      inset: 0;
      width: 1280px;
      height: 720px;
      object-fit: fill;
    }
    .visor-chip {
      position: absolute;
      left: 50%;
      top: 164px;
      transform: translateX(-50%);
      padding: 6px 14px 5px;
      background: rgba(4, 10, 18, 0.78);
      border: 1px solid rgba(143, 212, 238, 0.45);
      border-radius: 2px;
      box-shadow: 0 0 14px rgba(80, 190, 255, 0.28);
      font-family: "DIN Condensed", "Arial Narrow", Arial, sans-serif;
      font-weight: 700;
      color: #e8f6ff;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      line-height: 1.15;
    }
    .visor-chip .ver {
      font-size: 18px;
      letter-spacing: 0.08em;
    }
    .visor-chip .sub {
      margin-top: 2px;
      font-size: 13px;
      letter-spacing: 0.28em;
    }
    .foot-chip {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      padding: 6px 16px 5px;
      background: rgba(4, 10, 18, 0.78);
      border: 1px solid rgba(143, 212, 238, 0.45);
      border-radius: 2px;
      box-shadow: 0 0 14px rgba(80, 190, 255, 0.22);
      font-family: "DIN Condensed", "Arial Narrow", Arial, sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.32em;
      color: #e8f6ff;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="plate" alt="" src="PLATE_SRC" />
    <div class="visor-chip">
      <div class="ver">4.0.42</div>
      <div class="sub">Confer votes</div>
    </div>
    <div class="foot-chip">Burst runs the swarm</div>
  </div>
</body>
</html>
